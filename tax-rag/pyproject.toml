[project]
name = "taxrag"
version = "0.1.0"
description = "Citation-first federal + state tax RAG system"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "fastembed>=0.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "numpy>=1.26",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
taxrag = "taxrag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taxrag*"]

[tool.setuptools.package-data]
taxrag = ["store/*.sql", "collectors/seeds/*.yaml", "ui/*.html", "eval/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
