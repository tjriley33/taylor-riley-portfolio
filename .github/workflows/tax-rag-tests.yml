name: TaxRAG tests

on:
  push:
    paths: ["tax-rag/**"]
  pull_request:
    paths: ["tax-rag/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: tax-rag }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
